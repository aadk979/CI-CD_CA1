# ─────────────────────────────────────────────────────────────────────────
#  CI Pipeline — every push / PR to main
# ─────────────────────────────────────────────────────────────────────────
#
#   quality ─┬─► test ──┬─► image (build; push on main) ──► [CD Pipeline]
#            ├─► e2e ───┤
#   audit ───┘          └─► pages (QA reports → GitHub Pages, main only)
#
# No external database needed: Postgres + Redis run as service containers.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   PAGES_ENABLED = true   once Settings → Pages → Source is set to "GitHub Actions"
# ─────────────────────────────────────────────────────────────────────────

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24
  CI: true
  # Matches the service containers below (and .env.test).
  DATABASE_URL: postgresql://ticketing:ticketing@localhost:5432/ticketing_test?schema=public
  REDIS_URL: redis://localhost:6379
  # Throwaway test-only values (same as .env.test), not real secrets.
  BETTER_AUTH_SECRET: test-only-secret-test-only-secret-test-only
  BETTER_AUTH_URL: http://localhost:3100

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  quality:
    name: Lint, Format & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: TypeScript
        run: npm run typecheck

  # ═══════════════════════════════════════════════════════════════════════
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: npm audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high

  # ═══════════════════════════════════════════════════════════════════════
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ticketing
          POSTGRES_PASSWORD: ticketing
          POSTGRES_DB: ticketing_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ticketing" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Vitest (unit + integration, merged coverage, 80% gate)
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("coverage/coverage-summary.json")) process.exit(0);
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            const md = ["### Test coverage", "| Metric | % | Covered |", "|---|---|---|",
              ...["statements","branches","functions","lines"].map(row)].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ticketing
          POSTGRES_PASSWORD: ticketing
          POSTGRES_DB: ticketing_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ticketing" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Production build
        run: npm run build
      - name: Playwright
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════
  #  Build once, deploy that exact artifact: the image is tagged with the
  #  commit SHA and the CD pipeline deploys precisely this tag.
  image:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [test, e2e, audit]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: APP_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════════════
  pages:
    name: Publish QA Reports
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: public
      - name: Index page
        run: |
          cat > public/index.html <<EOF
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1"><title>QA Reports</title>
          <style>body{font-family:system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem}
          a{display:block;margin:.75rem 0;font-size:1.1rem}</style></head><body>
          <h1>QA Reports</h1>
          <p>Commit <code>${GITHUB_SHA::7}</code> · tests: ${{ needs.test.result }} · e2e: ${{ needs.e2e.result }}</p>
          <a href="coverage-report/index.html">Unit + integration coverage</a>
          <a href="playwright-report/index.html">Playwright E2E report</a>
          </body></html>
          EOF
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
