# ─────────────────────────────────────────────────────────────────────────
#  CodeQL — static security analysis (SAST) for the TypeScript codebase.
#  Runs on PRs and pushes to main, plus weekly to catch newly published
#  queries. Results appear under Security → Code scanning.
#  Dependency updates are handled separately by .github/dependabot.yml.
# ─────────────────────────────────────────────────────────────────────────

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
